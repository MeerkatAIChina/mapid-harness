<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- 背景 + 网格 -->
  <rect width="1000" height="1060" fill="#f8fafc"/>
  <rect width="1000" height="1060" fill="url(#grid)"/>

  <!-- 标题栏 -->
  <text x="30" y="34" fill="#1e293b" font-size="16" font-weight="700">Harness 调优 Loop · 全流程架构</text>
  <text x="30" y="52" fill="#64748b" font-size="9">单轮八步闭环 ①~⑧ · 评审链先验尺（金缺陷回归）再量稿 · 连续 2 轮全量合格 + 0 人工干预 → 收敛</text>

  <!-- 评审链区域边界 -->
  <rect x="60" y="452" width="880" height="156" rx="12" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="72" y="470" fill="#64748b" font-size="9" font-weight="600">④ 评审链 · 分层评审（客观给代码 · 单点给 Laya · 综合给 Claude）</text>

  <!-- 主流程箭头 -->
  <line x1="500" y1="134" x2="500" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="232" x2="500" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="320" x2="500" y2="346" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="437" fill="#059669" font-size="8" font-weight="600">是</text>
  <line x1="500" y1="426" x2="500" y2="448" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="510" x2="366" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="510" x2="656" y2="510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="542" x2="500" y2="556" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="602" x2="500" y2="618" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="712" fill="#e11d48" font-size="8" font-weight="600">否</text>
  <text x="560" y="716" fill="#64748b" font-size="8">· 缺陷清单 = 下轮调优输入</text>
  <line x1="500" y1="698" x2="500" y2="736" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="794" x2="500" y2="832" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="890" x2="500" y2="928" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="650" fill="#059669" font-size="8" font-weight="600">是</text>
  <line x1="585" y1="660" x2="671" y2="660" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="778" y="726" fill="#059669" font-size="8" font-weight="600">是</text>
  <line x1="770" y1="702" x2="770" y2="756" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右回环：未收敛 → 下一轮 -->
  <path d="M865,660 H950 V107 H676" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <text x="942" y="648" fill="#e11d48" font-size="8" text-anchor="end">否 · 未收敛，再跑一轮</text>

  <!-- 左回环：Loop 下一轮 -->
  <path d="M330,967 H30 V107 H326" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="20" y="560" fill="#94a3b8" font-size="8" transform="rotate(-90 20 560)">Loop · 下一轮</text>

  <!-- 修评审链回路（否 分支 + 跳线回归） -->
  <text x="600" y="378" fill="#e11d48" font-size="8" font-weight="600">否</text>
  <line x1="585" y1="388" x2="756" y2="388" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <path d="M850,412 V442 H516" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4"/>
  <path d="M484,442 H380 V388 H409" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>

  <!-- ① 准备 -->
  <rect x="330" y="80" width="340" height="54" rx="6" fill="#f8fafc"/>
  <rect x="330" y="80" width="340" height="54" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="102" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">① 准备：实验卫生</text>
  <text x="500" y="120" fill="#64748b" font-size="9" text-anchor="middle">记忆隔离 · 干净 thread · 记录提示词/Harness 版本</text>

  <!-- ② 执行 -->
  <rect x="330" y="168" width="340" height="64" rx="6" fill="#f8fafc"/>
  <rect x="330" y="168" width="340" height="64" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="190" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">② 执行生成任务（双轨）</text>
  <text x="500" y="207" fill="#64748b" font-size="8.5" text-anchor="middle">快速轮：5 章缩量 + 埋金缺陷 → 验机制</text>
  <text x="500" y="221" fill="#64748b" font-size="8.5" text-anchor="middle">全量轮：10 万字 → 判收敛</text>

  <!-- ③ 观察 -->
  <rect x="330" y="266" width="340" height="54" rx="6" fill="#f8fafc"/>
  <rect x="330" y="266" width="340" height="54" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="288" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">③ 观察：工作链还原</text>
  <text x="500" y="306" fill="#64748b" font-size="9" text-anchor="middle">trajectory 事件流 + workspace 巡检</text>

  <!-- 菱形：金缺陷回归 -->
  <polygon points="500,350 585,388 500,426 415,388" fill="#f8fafc"/>
  <polygon points="500,350 585,388 500,426 415,388" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="384" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">金缺陷回归</text>
  <text x="500" y="400" fill="#64748b" font-size="9" text-anchor="middle">三层检出率 ≥90%？</text>

  <!-- 修评审链 -->
  <rect x="760" y="364" width="180" height="48" rx="6" fill="#f8fafc"/>
  <rect x="760" y="364" width="180" height="48" rx="6" fill="rgba(225,29,72,0.1)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="850" y="384" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">修评审链（修尺子）</text>
  <text x="850" y="400" fill="#64748b" font-size="8.5" text-anchor="middle">补素材 / 改检查器，重跑回归</text>

  <!-- 评审链三层 -->
  <rect x="80" y="478" width="260" height="64" rx="6" fill="#f8fafc"/>
  <rect x="80" y="478" width="260" height="64" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.5"/>
  <text x="210" y="502" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">代码检查器（客观）</text>
  <text x="210" y="520" fill="#64748b" font-size="8" text-anchor="middle">字数 · 数值 · 约束 · 图表 · 结构（D2/4/5/7/8）</text>

  <rect x="370" y="478" width="260" height="64" rx="6" fill="#f8fafc"/>
  <rect x="370" y="478" width="260" height="64" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="502" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Laya 粗筛（单点信号）</text>
  <text x="500" y="520" fill="#64748b" font-size="8" text-anchor="middle">充实度 + 编造风险（D6 · 切片级）</text>

  <rect x="660" y="478" width="260" height="64" rx="6" fill="#f8fafc"/>
  <rect x="660" y="478" width="260" height="64" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.5"/>
  <text x="790" y="502" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">Claude 深审（综合判断）</text>
  <text x="790" y="520" fill="#64748b" font-size="8" text-anchor="middle">事实核查 + 判据置换 + 定性矛盾（D1/D3/D4）</text>

  <!-- 评审报告 -->
  <rect x="350" y="560" width="300" height="42" rx="6" fill="#f8fafc"/>
  <rect x="350" y="560" width="300" height="42" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="578" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">评审报告.md</text>
  <text x="500" y="594" fill="#64748b" font-size="8" text-anchor="middle">逐维度得分 · 证据 · 通过判定</text>

  <!-- 菱形 A：评审通过 -->
  <polygon points="500,622 585,660 500,698 415,660" fill="#f8fafc"/>
  <polygon points="500,622 585,660 500,698 415,660" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="664" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">评审通过？</text>

  <!-- 菱形 B：收敛判定 -->
  <polygon points="770,618 865,660 770,702 675,660" fill="#f8fafc"/>
  <polygon points="770,618 865,660 770,702 675,660" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.5"/>
  <text x="770" y="650" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">收敛条件满足？</text>
  <text x="770" y="666" fill="#64748b" font-size="8" text-anchor="middle">连续 2 轮全量无新增</text>
  <text x="770" y="678" fill="#64748b" font-size="8" text-anchor="middle">一票否决合格 + 0 人工干预</text>

  <!-- 终点：收敛 -->
  <rect x="640" y="760" width="260" height="64" rx="25" fill="#f8fafc"/>
  <rect x="640" y="760" width="260" height="64" rx="25" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="786" fill="#1e293b" font-size="11" font-weight="700" text-anchor="middle">收敛完成 · Loop 结束</text>
  <text x="770" y="806" fill="#64748b" font-size="9" text-anchor="middle">5 类致命缺陷压到零 · 交付</text>

  <!-- ⑤ 归因 -->
  <rect x="330" y="740" width="340" height="54" rx="6" fill="#f8fafc"/>
  <rect x="330" y="740" width="340" height="54" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="762" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">⑤ 归因：缺陷分层定位</text>
  <text x="500" y="780" fill="#64748b" font-size="9" text-anchor="middle">提示词层 · 编排层 · Harness 代码层 · 模型服务端</text>

  <!-- ⑥ 调优 -->
  <rect x="330" y="836" width="340" height="54" rx="6" fill="#f8fafc"/>
  <rect x="330" y="836" width="340" height="54" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="858" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">⑥ 调优：最小改动包</text>
  <text x="500" y="876" fill="#64748b" font-size="9" text-anchor="middle">一轮只动一个归因层 · 包内改动可单独验证</text>

  <!-- 止损线 -->
  <line x1="670" y1="883" x2="696" y2="883" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <rect x="700" y="856" width="240" height="54" rx="6" fill="#f8fafc"/>
  <rect x="700" y="856" width="240" height="54" rx="6" fill="rgba(225,29,72,0.1)" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="820" y="878" fill="#e11d48" font-size="10" font-weight="600" text-anchor="middle">止损线（上报用户）</text>
  <text x="820" y="896" fill="#64748b" font-size="8" text-anchor="middle">单项连续 3 轮无改善 → 调整目标或接受现状</text>

  <!-- ⑦⑧ 存档汇报 -->
  <rect x="330" y="932" width="340" height="70" rx="6" fill="#f8fafc"/>
  <rect x="330" y="932" width="340" height="70" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="954" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">⑦ 存档 + ⑧ 汇报</text>
  <text x="500" y="972" fill="#64748b" font-size="8" text-anchor="middle">rounds/round-N/ · changes.md · 评审报告 · commit</text>
  <text x="500" y="986" fill="#64748b" font-size="8" text-anchor="middle">汇报结果，用户批准后进下一轮</text>

  <!-- 图例 -->
  <rect x="240" y="1030" width="12" height="12" rx="3" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.2"/>
  <text x="258" y="1039" fill="#64748b" font-size="8">起止 / 收敛</text>
  <rect x="356" y="1030" width="12" height="12" rx="3" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.2"/>
  <text x="374" y="1039" fill="#64748b" font-size="8">Loop 步骤 ①~⑧</text>
  <rect x="494" y="1030" width="12" height="12" rx="3" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.2"/>
  <text x="512" y="1039" fill="#64748b" font-size="8">评审链</text>
  <polygon points="590,1024 597,1031 590,1038 583,1031" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.2"/>
  <text x="604" y="1039" fill="#64748b" font-size="8">质量门</text>
  <line x1="664" y1="1031" x2="696" y2="1031" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="702" y="1039" fill="#64748b" font-size="8">打回 / 修尺子 / 止损</text>
</svg>
